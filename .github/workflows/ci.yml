name: ci
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax check (the mechanical bot must at least parse)
        run: python -m compileall -q engine questions scripts
      - name: test suite (unittest, zero-dep)
        run: python -m unittest discover -s tests -v
